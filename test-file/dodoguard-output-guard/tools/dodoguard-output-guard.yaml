identity:
  name: "dodoguard-output-guard"
  author: "dodoguard"
  label:
    en_US: "DodoGuard Output Guard"
    zh_Hans: "DodoGuard 输出防护"
    pt_BR: "dodoguard-output-guard"
    ja_JP: "dodoguard-output-guard"
description:
  human:
    en_US: "Inspect generated text with a sliding window and block sensitive content."
    zh_Hans: "按滑动窗口检查生成文本并拦截敏感内容。"
    pt_BR: "Dify output guard demo"
    ja_JP: "Dify output guard demo"
  llm: "Dify output guard demo"
parameters:
  - name: text
    type: string
    required: true
    label:
      en_US: Text to inspect
      zh_Hans: 待检测文本
      pt_BR: Query string
      ja_JP: クエリ文字列
    human_description:
      en_US: "The generated output to inspect."
      zh_Hans: "需要检测的模型输出文本。"
      pt_BR: "Dify output guard demo"
      ja_JP: "Dify output guard demo"
    llm_description: "Text generated by the model that should be checked for sensitive content."
    form: llm
  - name: window_size
    type: string
    required: false
    default: "500"
    label:
      en_US: Window size
      zh_Hans: 窗口大小
      pt_BR: Window size
      ja_JP: ウィンドウサイズ
    human_description:
      en_US: "Number of characters checked in each window."
      zh_Hans: "每个检测窗口包含的字符数。"
      pt_BR: "Number of characters checked in each window."
      ja_JP: "各ウィンドウでチェックする文字数。"
    llm_description: "Optional sliding-window size in characters. Default 500."
    form: form
  - name: step
    type: string
    required: false
    default: "400"
    label:
      en_US: Window step
      zh_Hans: 窗口步长
      pt_BR: Window step
      ja_JP: ウィンドウステップ
    human_description:
      en_US: "Number of characters to move between windows."
      zh_Hans: "相邻检测窗口之间移动的字符数。"
      pt_BR: "Number of characters to move between windows."
      ja_JP: "ウィンドウ間で移動する文字数。"
    llm_description: "Optional sliding-window step in characters. Default 400."
    form: form
extra:
  python:
    source: tools/dodoguard-output-guard.py
