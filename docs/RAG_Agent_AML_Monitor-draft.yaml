                      "executable_action": "a0/a1/a2/a3",
                      "original_action": "原始建议动作",
                      "downgrade_reason": "降级原因（如适用）",
                      "approval_required": true/false,
                      "approval_chain": ["审批岗位1"],
                      "reason_code": "门控原因码",
