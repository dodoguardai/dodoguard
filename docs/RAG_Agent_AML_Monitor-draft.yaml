                type: integer
                value: "3"
            - name: systemPrompt
              input:
                type: string
                value: |-
                    你是一位银行风控数据专家，负责将原始交易数据转化为结构化的"可审计状态"表示。

                    【任务】
                    将输入数据转化为四个维度的结构化状态，输出纯JSON格式。

                    【输入数据说明】
                    - transaction_list: 交易流水列表，包含金额、时间、渠道、对手等信息
                    - customer_profile: 客户画像，包含KYC信息、风险等级等
                    - rule_hits: 已命中的规则列表
                    - account_open_date: 开户日期
                    - current_date: 当前日期

                    【输出格式要求】
                    必须输出纯JSON，不要任何markdown标记或解释文字：

                    {
                      "x_seq": {
                        "window_days": 7,
                        "transaction_count": 数值,
                        "total_amount_bucket": "金额分桶",
                        "channel_distribution": {"网银": 占比, "手机银行": 占比, ...},
                        "counterparty_concentration": "集中度指标",
                        "refund_ratio": 回流比例,
                        "night_transaction_ratio": 夜间交易占比,
                        "avg_amount": 平均金额,
                        "max_amount": 最大金额
                      },
                      "x_cust": {
                        "industry": "行业",
                        "region": "地域",
                        "kyc_completeness": "KYC完整度评分",
                        "historical_alerts": 历史告警次数,
                        "risk_level": "风险等级",
                        "account_type": "账户类型"
                      },
                      "x_graph": {
                        "two_hop_counterparties": 二跳对手数量,
                        "cluster_coefficient": "团簇系数分桶",
                        "fund_loop_indicator": true/false,
                        "abnormal_subgraph_rules": ["命中的图规则1", "命中的图规则2"]
                      },
                      "x_know": {
                        "rule_hits": ["规则1", "规则2"],
                        "red_flag_tags": ["红旗标签1", "红旗标签2"],
                        "alert_reason": "告警原因摘要"
                      }
                    }

                    【约束】
                    1. 所有数值字段必须真实计算，不能虚构
                    2. 时间窗口以开户后早期阶段为准（0-90天）
                    3. 输出必须是合法JSON格式
            - name: stableSystemPrompt
              input:
                type: string
                value: ""
            - name: canContinue
              input:
                type: boolean
                value: false
            - name: loopPromptVersion
              input:
                type: string
                value: ""
            - name: loopPromptName
              input:
                type: string
                value: ""
            - name: loopPromptId
              input:
                type: string
                value: ""
        node_inputs:
            - name: customer_id
              input:
                value:
                    path: customer_id
                    ref_node: "100001"
            - name: account_open_date
              input:
                value:
