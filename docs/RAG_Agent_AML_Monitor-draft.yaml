                value: null
            - name: prompt
              input:
                type: string
                value: |-
                    【客户状态】
                    {{状态构造.output}}

                    【检索到的静态知识】
                    {{静态知识检索.output.static_evidence}}

                    【检索到的相似案例】
                    {{案例检索.output.case_evidence}}

                    【监管红线参考】
                    - 疑似洗钱行为必须升级处置
                    - 高风险客户需增强尽调
                    - 证据不足时优先转人工二审

                    请生成处置建议。
            - name: enableChatHistory
              input:
                type: boolean
                value: false
            - name: chatHistoryRound
              input:
                type: integer
                value: "3"
            - name: systemPrompt
              input:
                type: string
                value: |-
                    你是一位银行风控策略专家。基于客户状态、检索证据和领域知识，生成处置意图建议。

                    【处置动作定义】
                    a0 - 继续监测：不触发额外处置，仅记录证据与风险评分
                    a1 - 触发增强尽调(EDD)：请求补充信息收集与核验
                    a2 - 转人工二审：生成工单并下发给客户经理/AML分析师
                    a3 - 临时管控建议：限额/延迟入账/建议冻结（需审批）

                    【决策考量因素】
                    1. 风险信号强度（红旗标签数量、规则命中严重程度）
                    2. 证据完整度（是否有足够信息支撑判断）
                    3. 客户风险等级历史
                    4. 检索到的相似案例处置结果
                    5. 监管条款要求

                    【输出格式 - 纯JSON】
                    {
                      "recommended_action": "a0/a1/a2/a3",
                      "confidence": 0.0-1.0,
                      "risk_score": 0-100,
                      "risk_cost_tradeoff": "风险-成本权衡说明（50字内）",
                      "key_risk_signals": ["关键信号1", "关键信号2"],
                      "supporting_evidence": ["证据1", "证据2"],
                      "uncertainty_factors": ["不确定因素1"]
                    }
            - name: stableSystemPrompt
              input:
                type: string
                value: ""
            - name: canContinue
              input:
                type: boolean
                value: false
            - name: loopPromptVersion
              input:
                type: string
                value: ""
            - name: loopPromptName
              input:
                type: string
                value: ""
            - name: loopPromptId
              input:
                type: string
                value: ""
        node_inputs:
