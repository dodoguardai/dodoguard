                    风险等级: {{状态构造.output.x_cust.risk_level}}
                    账户类型: {{状态构造.output.x_cust.account_type}}

                    【门控规则】
                    - a3(临时管控)必须审批
                    - 红旗标签包含"疑似洗钱"必须转二审(a2)
                    - 证据完整度<0.5时降级为a2或a0

                    请执行门控检查。
            - name: enableChatHistory
              input:
                type: boolean
                value: false
